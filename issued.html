<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Issued & Returns | Library Book Manager</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Bitter:wght@600;700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>
  <div id="hdr"></div>
  <main class="container py-4">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
      <h2 class="panel-title mb-0"><i class="bi bi-arrow-left-right me-2"></i>Issued &amp; Returns</h2>
      <div class="btn-group btn-group-sm" role="group" aria-label="Filter"><button class="btn btn-outline-secondary active" data-f="all">All issued</button><button class="btn btn-outline-secondary" data-f="over">Overdue only</button></div>
    </div>
    <div class="panel"><div class="table-responsive"><table class="table align-middle book-table"><thead><tr><th>ID</th><th>Book</th><th>Borrower</th><th>Issued on</th><th>Due</th><th>Status</th><th class="text-end">Action</th></tr></thead><tbody id="rows"></tbody></table></div><div class="empty-state d-none" id="none"></div></div>
  </main>
  <footer class="container pb-4 small text-muted">Classroom prototype. Sample data is fictional and is saved in this browser only.</footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="common.js"></script>
  <script>
boot("out");

let f="all";
function draw(){const l=books.filter(b=>b.issued&&(f==="all"||overdue(b)));
 $("rows").innerHTML=l.map(b=>{const d=overdue(b)?Math.round((new Date(today())-new Date(b.dueOn))/864e5):0;return`<tr><td class="book-id">${esc(b.id)}</td><td>${esc(b.title)}<span class="meta">${esc(b.author)}</span></td><td>${esc(b.borrower)}</td><td>${esc(b.issuedOn)}</td><td>${esc(b.dueOn)}</td><td>${badge(b)}${d?`<span class="meta">${d} day(s) late</span>`:""}</td><td class="text-end"><button class="btn btn-sm btn-outline-secondary" data-id="${esc(b.id)}">Return</button></td></tr>`}).join("");
 $("none").classList.toggle("d-none",l.length>0);$("none").innerHTML='<i class="bi bi-check2-circle"></i>'+(f==="over"?"No overdue books.":"No books are issued right now.")}
document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{f=b.dataset.f;document.querySelectorAll("[data-f]").forEach(x=>x.classList.toggle("active",x===b));draw()});
$("rows").onclick=e=>{const b=e.target.closest("button[data-id]");if(b)openBook(b.dataset.id)};
window.onChange=draw;draw();
  </script>
</body>
</html>
