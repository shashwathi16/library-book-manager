<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home | Library Book Manager</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Bitter:wght@600;700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>
  <div id="hdr"></div>
  <main class="container py-4">
    <section class="welcome mb-4">
      <h2><i class="bi bi-bank2 me-2"></i>Welcome to the Library</h2>
      <p class="mb-3">Walk the shelves, pick a book, and see who has borrowed it. Click any book spine to open it.</p>
      <a class="btn btn-light" href="shelves.html"><i class="bi bi-bookshelf me-1"></i>Browse shelves</a>
      <a class="btn btn-outline-light" href="add.html"><i class="bi bi-plus-square me-1"></i>Add books</a>
    </section>
    <div class="row g-3 mb-4" id="stats"></div>
    <h3 class="h5 mb-2">Featured shelf</h3>
    <div id="featured"></div>
    <div class="row g-3 mt-1" id="cards"></div>
  </main>
  <footer class="container pb-4 small text-muted">Classroom prototype. Sample data is fictional and is saved in this browser only.</footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="common.js"></script>
  <script>
boot("home");

const tiles=[["shelves.html","bi-bookshelf","Browse Shelves","Walk along the wooden shelves, one per category."],["catalogue.html","bi-journal-text","Catalogue","Search, filter, sort, edit and export every book."],["add.html","bi-plus-square","Add Books","Add one book, or paste many books at once."],["issued.html","bi-arrow-left-right","Issued & Returns","See who has which book and what is overdue."]];
$("cards").innerHTML=tiles.map(t=>`<div class="col-6 col-lg-3"><a class="tile" href="${t[0]}"><i class="bi ${t[1]}"></i><b>${t[2]}</b><span>${t[3]}</span></a></div>`).join("");
function draw(){const out=books.filter(b=>b.issued).length,od=books.filter(overdue).length;
 $("stats").innerHTML=[["Total books",books.length,"ic-total","bi-collection"],["Available",books.length-out,"ic-avail","bi-check2-circle"],["Issued",out,"ic-issued","bi-person-check"],["Overdue",od,"ic-over","bi-alarm"]].map(s=>`<div class="col-6 col-lg-3"><div class="stat"><span class="stat-icon ${s[2]}"><i class="bi ${s[3]}"></i></span><div><span class="stat-num">${s[1]}</span><span class="stat-label">${s[0]}</span></div></div></div>`).join("");
 $("featured").innerHTML=caseHTML("Today's picks",books.slice(0,14));}
window.onChange=draw;draw();
  </script>
</body>
</html>
